                        align: top_left
                        text_font: nunito_48
                        text_color: 0x9BA2BC
                        text: "—°"

                    - label:
                        id: weather_humidity_value
                        x: -60
                        y: 10
                        align: top_right
                        text_font: nunito_18
                        text_color: 0x9BA2BC
                        text: " "

                    - label:
                        id: weather_humidity_icon
                        x: -30
