              - homeassistant.service:
                  service: climate.set_hvac_mode
                  data:
                    entity_id: climate.hallway
                    hvac_mode: "off"
            widgets:
              - label:
                  id: climate_off_mode_icon
                  align: center
                  text_font: mdi_icons_28
                  text_color: 0x9BA2BC
                  text: "\U000F0425"

        # ── + button ──────────────────────────────────────────────────────────
        - button:
            id: climate_plus_btn
            x: 14
            y: 270
            width: 72
            height: 72
            align: top_left
            radius: 36
            bg_color: 0x2A2B3A
            border_opa: transp
            shadow_opa: transp
            on_click:
              - lambda: |-
                  float t = id(target_setpoint) + 0.5f;
                  if (t > 30.0f) t = 30.0f;
                  id(target_setpoint) = t;
                  char tbuf[8];
                  snprintf(tbuf, sizeof(tbuf), "%.1f", t);
                  lv_label_set_text(id(climate_target_temperature_label), tbuf);
                  lv_arc_set_value(id(climate_arc_base_heat), (int)(t * 2 + 0.5f));
              - homeassistant.service:
                  service: climate.set_temperature
                  data:
                    entity_id: climate.hallway
                  data_template:
                    temperature: !lambda "return id(target_setpoint);"
            widgets:
              - label:
                  id: climate_plus_label
                  align: center
                  text_font: mdi_icons_40
                  text_color: 0x9BA2BC
                  text: "\U000F0415"

        # ── − button ──────────────────────────────────────────────────────────
        - button:
            id: climate_minus_btn
            x: 14
            y: 360
            width: 72
            height: 72
            align: top_left
            radius: 36
            bg_color: 0x2A2B3A
            border_opa: transp
            shadow_opa: transp
            on_click:
              - lambda: |-
                  float t = id(target_setpoint) - 0.5f;
                  if (t < 10.0f) t = 10.0f;
                  id(target_setpoint) = t;
                  char tbuf[8];
                  snprintf(tbuf, sizeof(tbuf), "%.1f", t);
                  lv_label_set_text(id(climate_target_temperature_label), tbuf);
                  lv_arc_set_value(id(climate_arc_base_heat), (int)(t * 2 + 0.5f));
              - homeassistant.service:
                  service: climate.set_temperature
                  data:
                    entity_id: climate.hallway
                  data_template:
                    temperature: !lambda "return id(target_setpoint);"
            widgets:
              - label:
                  id: climate_minus_label
                  align: center
                  text_font: mdi_icons_40
                  text_color: 0x9BA2BC
                  text: "\U000F0374"

        # ── Arc dial (right side) ─────────────────────────────────────────────
        # x=100 positions the container so the arc stays fully on screen.
        # Arcs are 370x370 — centred in the 380x480 container they stay within
        # bounds without any clipping.
        - obj:
            x: 100
            y: 0
            width: 380
            height: 480
            align: top_left
            pad_all: 0
            bg_opa: transp
            border_opa: transp
            shadow_opa: transp
            clickable: false
            widgets:

              # Background disc
              - obj:
                  width: 340
                  height: 340
                  align: center
                  clickable: false
                  radius: 170
                  bg_color: 0x2E2F3E
                  border_color: 0xf2f0eb
                  border_width: 2
                  border_opa: 15%

              # Full-sweep background arc in steel
              # start_angle=110 (lower-left, 20° past bottom clockwise)
              # end_angle=70   (lower-right, 20° before bottom)
              # → 320° sweep, 40° gap centred at the very bottom
              - arc:
                  id: climate_arc_background
                  clickable: false
                  adjustable: false
                  align: center
                  width: 370
                  height: 370
                  start_angle: 110
                  end_angle: 70
                  min_value: 20
                  max_value: 60
                  value: 60
                  arc_width: 30
                  arc_color: 0x606682
                  indicator:
                    arc_opa: transp
                    arc_width: 30

              # Current temp dot knob
              - arc:
                  id: climate_arc_current_temperature
                  clickable: false
                  adjustable: false
                  align: center
                  width: 370
                  height: 370
                  start_angle: 110
                  end_angle: 70
                  min_value: 20
                  max_value: 60
                  value: 40
                  arc_width: 30
                  arc_opa: transp
                  indicator:
                    arc_opa: transp
                    arc_width: 30
                  knob:
                    pad_all: -10
                    bg_color: 0x9BA2BC

              # Heat arc (amber, draggable setpoint)
              - arc:
                  id: climate_arc_base_heat
                  clickable: true
                  adjustable: true
                  adv_hittest: true
                  align: center
                  width: 370
                  height: 370
                  start_angle: 110
                  end_angle: 70
                  min_value: 20
                  max_value: 60
                  value: 40
                  arc_width: 30
                  arc_opa: transp
                  indicator:
                    arc_color: 0xFF6600
                    arc_width: 30
                  knob:
                    pad_all: -2
                    bg_color: 0xf2f0eb
                    border_color: 0xFF6600
                    border_width: 4
                  on_value:
                    - lambda: |-
                        float temp = x / 2.0f;
                        id(target_setpoint) = temp;
                        char tbuf[8];
                        snprintf(tbuf, sizeof(tbuf), "%.1f", temp);
                        lv_label_set_text(id(climate_target_temperature_label), tbuf);
                  on_release:
                    - homeassistant.service:
                        service: climate.set_temperature
                        data:
                          entity_id: climate.hallway
                        data_template:
                          temperature: !lambda "return id(target_setpoint);"

              # Target temperature — single label, no baseline misalignment
              - label:
                  id: climate_target_temperature_label
                  align: center
                  x: 0
                  y: -22
                  text_font: nunito_48
                  text_color: 0xF4A900
                  text: "20.0"
                  text_align: center

              # Current temperature
              - label:
                  id: climate_current_temperature_label
                  align: center
                  y: 52
                  text_font: nunito_30
                  text_color: 0x606682
                  text: "—"

        # ── Back button ───────────────────────────────────────────────────────
        - button:
            id: climate_back_btn
            y: -14
            width: 160
            height: 44
            radius: 22
            align: bottom_mid
            bg_color: 0x2A2B3A
            border_opa: transp
            shadow_opa: transp
            on_click:
              - lvgl.page.show:
                  id: home_page
                  animation: FADE_IN
                  time: 200ms
            widgets:
              - label:
                  align: center
                  text_font: nunito_18
                  text_color: 0x9BA2BC
                  text: "Back"
