                                - lambda: |-
                                    id(night_mode_enabled) = !id(night_mode_enabled);
                                    bool en = id(night_mode_enabled);
                                    // Update checkbox icon
                                    lv_label_set_text(id(night_mode_icon),
                                      en ? "\U000F0132" : "\U000F0131");
                                    lv_obj_set_style_text_color(id(night_mode_icon),
                                      lv_color_hex(en ? 0xF4A900 : 0x606682), LV_PART_MAIN);
                                    // Apply immediately if in night hours
                                    auto now = id(sntp_time).now();
                                    if (now.is_valid()) {
                                      auto call = id(display_timeout_backlight).make_call();
                                      if (en && now.hour < 6) {
                                        call.set_value(1);
                                      } else {
                                        call.set_value(id(user_sleep_minutes));
                                      }
                                      call.perform();
                                    }
