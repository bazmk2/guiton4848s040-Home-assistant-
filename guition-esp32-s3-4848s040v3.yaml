# ============================================================================
# LVGL
# ============================================================================
#
#  Three pages:
#    home_page   — single page with 4 sub-modes (HOME/WEATHER/INFO/SETTINGS)
#    light_page  — controls for lounge lamp / main / display case
#    climate_page — hallway thermostat with arc dial
#
#  Color palette (alaltitov style):
#    bg            #0d0d0d   near-black
#    card          #343645   slate blue-gray
#    text          #9BA2BC   misty blue
#    steel         #606682   steel blue (inactive icons)
#    amber         #f4a900   active accent
#    sky           #3FA7F3   info accent
#    deep_orange   #ff6600   heat arc
#
# ============================================================================

lvgl:
  displays:
    - tft_display
  touchscreens:
    - tft_touch
  rotation: 0
  color_depth: 16
  bg_color: 0x0d0d0d
  default_font: nunito_20

  on_idle:
    timeout: !lambda "return (int)(id(display_timeout_backlight).state * 60 * 1000);"
    then:
      - if:
          condition:
            lambda: "return id(display_timeout_backlight).state >= 0;"
          then:
            - light.turn_off:
                id: display_backlight
                transition_length: 2s
            # Do NOT call lvgl.pause here — pausing LVGL stops it processing
            # touch events, which means on_touch never fires to wake the screen.
            # The backlight off is sufficient; LVGL keeps running in the dark.

  pages:

    # ══════════════════════════════════════════════════════════════════════════
    # HOME PAGE  (modes: 0=HOME  1=WEATHER  2=INFO  3=SETTINGS)
    # ══════════════════════════════════════════════════════════════════════════
    - id: home_page
      bg_color: 0x0d0d0d
      scrollable: false

      widgets:

        # ── Top status indicator bar ──────────────────────────────────────────
        - obj:
            id: home_bg_indicators
            y: 10
            width: 460
            height: 40
            align: top_mid
            pad_all: 0
            bg_opa: transp
            border_opa: transp
            shadow_opa: transp
            widgets:

              - label:
                  id: wifi_status
                  align: left_mid
                  x: 20
                  text: "\U0000e934"
                  text_color: 0x606682
                  text_font: icons_24

              - label:
                  id: ha_status
                  align: left_mid
                  x: 60
                  text: "\U000F07D0"
                  text_color: 0x606682
                  text_font: mdi_icons_24



        # ── Main card ─────────────────────────────────────────────────────────
        - obj:
            id: main_widget_background
            y: 60
            width: 440
            height: 220
            align: top_mid
            clickable: false
            scrollable: false
            radius: 20
            pad_all: 0
            bg_color: 0x343645
            border_opa: transp
            shadow_opa: transp
            widgets:

              # ── Weather + time header row ──────────────────────────────────
              - obj:
                  id: weather_time_widget
                  hidden: false
                  width: 440
                  height: 80
                  align: top_mid
                  clickable: false
                  scrollable: false
                  radius: 20
                  pad_all: 0
                  bg_opa: transp
                  border_opa: transp
                  shadow_opa: transp
                  widgets:
                    - label:
                        id: weather_temperature_value
                        x: 30
