    # ══════════════════════════════════════════════════════════════════════════
    # LIGHT PAGE
    # ══════════════════════════════════════════════════════════════════════════
    #
    #  Layout (480×480):
    #
    #   ┌──────────┐  ┌────────────────────────────────────────┐  y=50
    #   │          │  │  ○  Lounge Lamp                        │
    #   │  ☀       │  └────────────────────────────────────────┘  y=156
    #   │          │  ┌────────────────────────────────────────┐
    #   │  slider  │  │  ○  Lounge Main                        │
    #   │  (amber) │  └────────────────────────────────────────┘  y=262
    #   │          │  ┌────────────────────────────────────────┐
    #   │          │  │  ○  Display Case                       │
    #   └──────────┘  └────────────────────────────────────────┘  y=368
    #   x=14 w=90          x=118  w=348
    #
    #  Circle border glows blue when that light owns the slider.
    #  Bulb icon glows amber when light is on, steel when off.
    #  Tapping toggles the light AND selects it for brightness control.
    #
    - id: light_page
      bg_color: 0x0d0d0d
      scrollable: false
      widgets:

        # ── Brightness slider panel ───────────────────────────────────────────
        - obj:
            id: light_brightness_background
            x: 14
            y: 50
            width: 90
            height: 370
            align: top_left
            radius: 20
            bg_color: 0x2A2B3A
            pad_all: 0
            scrollable: false
            border_opa: transp
            shadow_opa: transp
            widgets:
              - slider:
                  id: light_brightness_slider
                  align: center
                  y: 0
                  radius: 14
                  width: 44
                  height: 320
                  min_value: 0
                  max_value: 100
                  value: 100
                  bg_color: 0x606682
                  indicator:
                    bg_color: 0xF4A900
                    radius: 14
                  knob:
                    bg_color: 0xf2f0eb
                    radius: 14
                    pad_all: 2
                  on_release:
                    - homeassistant.service:
                        service: light.turn_on
                        data_template:
                          entity_id: !lambda |-
                            static const char* ents[] = {
                              "light.lounge_lamp",
                              "light.lounge_main",
                              "light.display_display_case"
                            };
                            return ents[id(selected_light_idx)];
                          brightness: !lambda return (int)(x * 2.55f);

        # ── Light card 0: Lounge Lamp ─────────────────────────────────────────
        - obj:
            id: light_card_0
            x: 118
            y: 50
            width: 348
            height: 96
            align: top_left
            radius: 18
            bg_color: 0x2A2B3A
            scrollable: false
            border_opa: transp
            shadow_opa: transp
            widgets:
              # Bulb icon button — toggles light on/off only
              - button:
                  id: light_btn_0
                  x: 18
                  align: left_mid
                  width: 60
                  height: 60
                  radius: 30
                  bg_color: 0x343645
                  border_color: 0x3FA7F3
                  border_width: 3
                  border_opa: cover
                  shadow_opa: transp
                  on_click:
                    - homeassistant.service:
                        service: light.toggle
                        data:
                          entity_id: light.lounge_lamp
                  widgets:
                    - label:
                        id: light_btn_0_icon
                        align: center
                        text_font: icons_28
                        text_color: 0x606682
                        text: "\U0000e908"
              # Label tap area — selects this light for brightness control
              - obj:
                  x: 96
                  align: left_mid
                  width: 220
                  height: 60
                  radius: 8
                  bg_opa: transp
                  border_opa: transp
                  shadow_opa: transp
                  scrollable: false
                  clickable: true
                  on_click:
                    - globals.set:
                        id: selected_light_idx
                        value: "0"
                    - lambda: |-
                        lv_obj_set_style_border_opa(id(light_btn_0), LV_OPA_COVER, LV_PART_MAIN);
                        lv_obj_set_style_border_opa(id(light_btn_1), LV_OPA_TRANSP, LV_PART_MAIN);
                        lv_obj_set_style_border_opa(id(light_btn_2), LV_OPA_TRANSP, LV_PART_MAIN);
                  widgets:
                    - label:
                        align: left_mid
                        x: 8
                        text_font: nunito_20
                        text_color: 0x9BA2BC
                        text: "Lounge Lamp"

        # ── Light card 1: Lounge Main ─────────────────────────────────────────
        - obj:
            id: light_card_1
            x: 118
            y: 156
            width: 348
            height: 96
            align: top_left
            radius: 18
            bg_color: 0x2A2B3A
            scrollable: false
            border_opa: transp
            shadow_opa: transp
            widgets:
              - button:
                  id: light_btn_1
                  x: 18
                  align: left_mid
                  width: 60
                  height: 60
                  radius: 30
                  bg_color: 0x343645
                  border_color: 0x3FA7F3
                  border_width: 3
                  border_opa: transp
                  shadow_opa: transp
                  on_click:
                    - homeassistant.service:
                        service: light.toggle
                        data:
                          entity_id: light.lounge_main
                  widgets:
                    - label:
                        id: light_btn_1_icon
                        align: center
                        text_font: icons_28
                        text_color: 0x606682
                        text: "\U0000e908"
              - obj:
                  x: 96
                  align: left_mid
                  width: 220
                  height: 60
                  radius: 8
                  bg_opa: transp
                  border_opa: transp
                  shadow_opa: transp
                  scrollable: false
                  clickable: true
                  on_click:
                    - globals.set:
                        id: selected_light_idx
                        value: "1"
                    - lambda: |-
                        lv_obj_set_style_border_opa(id(light_btn_0), LV_OPA_TRANSP, LV_PART_MAIN);
                        lv_obj_set_style_border_opa(id(light_btn_1), LV_OPA_COVER, LV_PART_MAIN);
                        lv_obj_set_style_border_opa(id(light_btn_2), LV_OPA_TRANSP, LV_PART_MAIN);
                  widgets:
                    - label:
                        align: left_mid
                        x: 8
                        text_font: nunito_20
                        text_color: 0x9BA2BC
                        text: "Lounge Main"

        # ── Light card 2: Display Case ────────────────────────────────────────
        - obj:
            id: light_card_2
            x: 118
            y: 262
            width: 348
            height: 96
            align: top_left
            radius: 18
            bg_color: 0x2A2B3A
            scrollable: false
            border_opa: transp
            shadow_opa: transp
            widgets:
              - button:
                  id: light_btn_2
                  x: 18
                  align: left_mid
                  width: 60
                  height: 60
                  radius: 30
                  bg_color: 0x343645
                  border_color: 0x3FA7F3
                  border_width: 3
                  border_opa: transp
                  shadow_opa: transp
                  on_click:
                    - homeassistant.service:
                        service: light.toggle
                        data:
                          entity_id: light.display_display_case
                  widgets:
                    - label:
                        id: light_btn_2_icon
                        align: center
                        text_font: icons_28
                        text_color: 0x606682
                        text: "\U0000e908"
              - obj:
                  x: 96
                  align: left_mid
                  width: 220
                  height: 60
                  radius: 8
                  bg_opa: transp
                  border_opa: transp
                  shadow_opa: transp
                  scrollable: false
                  clickable: true
                  on_click:
                    - globals.set:
                        id: selected_light_idx
                        value: "2"
                    - lambda: |-
                        lv_obj_set_style_border_opa(id(light_btn_0), LV_OPA_TRANSP, LV_PART_MAIN);
                        lv_obj_set_style_border_opa(id(light_btn_1), LV_OPA_TRANSP, LV_PART_MAIN);
                        lv_obj_set_style_border_opa(id(light_btn_2), LV_OPA_COVER, LV_PART_MAIN);
                  widgets:
                    - label:
                        align: left_mid
                        x: 8
                        text_font: nunito_20
                        text_color: 0x9BA2BC
                        text: "Display Case"

        # ── Back button ───────────────────────────────────────────────────────
        - button:
            id: light_back_btn
            y: -14
            width: 160
            height: 44
            radius: 22
            align: bottom_mid
            bg_color: 0x2A2B3A
            border_opa: transp
            shadow_opa: transp
            on_click:
              - lvgl.page.show:
                  id: home_page
                  animation: FADE_IN
                  time: 200ms
            widgets:
              - label:
                  align: center
                  text_font: nunito_18
                  text_color: 0x9BA2BC
                  text: "Back"


