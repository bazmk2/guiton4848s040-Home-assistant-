# ============================================================================
#  Kitchen Panel based on Lounge Panel — adapted from alaltitov/Guition-ESP32-S3-4848S040
#
#  IMPORTANT: Copy the assets/ folder from the repo into your ESPHome
#  config directory (next to this YAML file) before compiling.
#  You need:  assets/fonts/  assets/images/weather/  assets/images/light/
# ============================================================================

esphome:
  name: "kitchen-panel"
  friendly_name: "Kitchen Panel"
  on_boot:
    priority: -100
    then:
      - script.execute: time_update

esp32:
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret encryption_key
  on_client_connected:
    - lambda: |-
        lv_label_set_text(id(ha_status), "\U000F07D0");
        lv_obj_set_style_text_color(id(ha_status), lv_color_hex(0x5CA848), LV_PART_MAIN);
  on_client_disconnected:
    - lambda: |-
        lv_obj_set_style_text_color(id(ha_status), lv_color_hex(0x606682), LV_PART_MAIN);

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "4848s040 Fallback"
    password: !secret ota_password
  on_connect:
    - script.execute: update_wifi_icon
  on_disconnect:
    - lambda: |-
        lv_label_set_text(id(wifi_status), "\U0000e931");
        lv_obj_set_style_text_color(id(wifi_status), lv_color_hex(0x606682), LV_PART_MAIN);

captive_portal:

# ─── Bluetooth Proxy ──────────────────────────────────────────────────────────
# Forwards BLE advertisements + active connections to Home Assistant.
# Conservative settings tuned for a panel that also runs an LVGL UI:
#   - 3 active connection slots (default; max 5 recommended)
#   - active scanning ON so HA can discover new devices
#   - BLE/WiFi share the 2.4 GHz radio so expect a small WiFi throughput hit
# RAM impact: ~30 KB for the BLE stack + ~1 KB per connection slot.
esp32_ble_tracker:
  scan_parameters:
    active: true
    interval: 1100ms
    window: 1100ms

bluetooth_proxy:
  active: true

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      - lambda: id(backlight_output).set_level(0.0);

time:
  - platform: sntp
    id: sntp_time
    timezone: "Europe/London"
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
    on_time_sync:
      - script.execute: time_update
    on_time:
      - minutes: '*'
        seconds: 0
        then:
          - script.execute: time_update
          # Night mode: 00:00–05:59 → force 1 min timeout; 06:00+ → restore user pref
          - lambda: |-
              if (!id(night_mode_enabled)) return;
              auto now = id(sntp_time).now();
              if (!now.is_valid()) return;
              auto call = id(display_timeout_backlight).make_call();
              if (now.hour < 6) {
                call.set_value(1);
              } else {
                call.set_value(id(user_sleep_minutes));
              }
              call.perform();

# ─── Globals ──────────────────────────────────────────────────────────────────
globals:
  # 0=HOME  1=WEATHER  2=INFO  3=SETTINGS
  - id: current_mode
    type: int
    initial_value: '0'
  - id: display_timeout_val
    type: int
    restore_value: true
    initial_value: '0'
  # User's preferred sleep timeout in minutes (5/10/15/30)
  - id: user_sleep_minutes
    type: int
    restore_value: true
    initial_value: '5'
  # Night mode: between 00:00–06:00, dim then off after 1 min idle
  - id: night_mode_enabled
    type: bool
    restore_value: true
    initial_value: 'false'

# ─── On-device Relays ─────────────────────────────────────────────────────────
switch:
  - platform: gpio
    name: "Relay 1"
    id: relay_1
    pin: { number: GPIO40, inverted: false }
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: |-
          lv_obj_set_style_text_color(id(relay_btn_0_icon), lv_color_hex(0xF4A900), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(relay_btn_0_inner), lv_color_hex(0x1A3A50), LV_PART_MAIN);
    on_turn_off:
      - lambda: |-
          lv_obj_set_style_text_color(id(relay_btn_0_icon), lv_color_hex(0x9BA2BC), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(relay_btn_0_inner), lv_color_hex(0x343645), LV_PART_MAIN);
  - platform: gpio
    name: "Relay 2"
    id: relay_2
    pin: { number: GPIO2, inverted: false }
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: |-
          lv_obj_set_style_text_color(id(relay_btn_1_icon), lv_color_hex(0xF4A900), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(relay_btn_1_inner), lv_color_hex(0x1A3A50), LV_PART_MAIN);
    on_turn_off:
      - lambda: |-
          lv_obj_set_style_text_color(id(relay_btn_1_icon), lv_color_hex(0x9BA2BC), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(relay_btn_1_inner), lv_color_hex(0x343645), LV_PART_MAIN);
  - platform: gpio
    name: "Relay 3"
    id: relay_3
    pin: { number: GPIO1, inverted: false }
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: |-
          lv_obj_set_style_text_color(id(relay_btn_2_icon), lv_color_hex(0xF4A900), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(relay_btn_2_inner), lv_color_hex(0x1A3A50), LV_PART_MAIN);
    on_turn_off:
      - lambda: |-
          lv_obj_set_style_text_color(id(relay_btn_2_icon), lv_color_hex(0x9BA2BC), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(relay_btn_2_inner), lv_color_hex(0x343645), LV_PART_MAIN);

# ─── HA Light state listeners ─────────────────────────────────────────────────
binary_sensor:
  - platform: status
    name: "Device Status"

# ─── Sensors ──────────────────────────────────────────────────────────────────
sensor:
  # Outside temperature — home circle + weather page
  - platform: homeassistant
    id: ha_alley_temp
    entity_id: sensor.alleytemp_temperature

  # Outside pressure — shown on weather page below the condition text
  - platform: homeassistant
    id: ha_alley_pressure
    entity_id: sensor.alleytemp_pressure
    on_value:
      - lvgl.label.update:
          id: weather_outside_pressure_value
          text: !lambda |-
            char buf[24];
            snprintf(buf, sizeof(buf), "%.0f hPa", x);
            return std::string(buf);


  # Weather
  - platform: homeassistant
    id: ha_weather_temp
    entity_id: weather.forecast_home
    attribute: temperature
    on_value:
      - lvgl.label.update:
          id: weather_temperature_value
          text: !lambda |-
            char buf[8];
            snprintf(buf, sizeof(buf), "%.0f°", x);
            return std::string(buf);

  - platform: homeassistant
    id: ha_weather_humidity
    entity_id: weather.forecast_home
    attribute: humidity
    on_value:
      - lvgl.label.update:
          id: weather_humidity_value
          text: !lambda |-
            char buf[8];
            snprintf(buf, sizeof(buf), "%.0f%%", x);
            return std::string(buf);

  - platform: homeassistant
    id: ha_weather_wind
    entity_id: weather.forecast_home
    attribute: wind_speed
    on_value:
      - lvgl.label.update:
          id: weather_wind_speed_value
          text: !lambda |-
            char buf[12];
            snprintf(buf, sizeof(buf), "%.1f ", x);
            return std::string(buf);

  # Internal chip temperature — info circle
  - platform: internal_temperature
    name: "ESP32 Internal Temperature"
    id: esp32_temperature
    update_interval: 30s
    on_value:
      - lvgl.label.update:
          id: cpu_temp_info_state
          text: !lambda |-
            char buf[12];
            snprintf(buf, sizeof(buf), "%.1f°C", x);
            return std::string(buf);

  # WiFi signal
  - platform: wifi_signal
    name: "WiFi Signal"
    id: sensor_wifi_signal
    update_interval: 30s
    on_value:
      - lvgl.label.update:
          id: wifi_signal_info_state
          text: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), "%.1f dBm", x);
            return std::string(buf);

  - platform: wifi_signal
    id: wifi_signal_percent
    update_interval: 30s
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    internal: true
    on_value:
      - script.execute: update_wifi_icon

  - platform: uptime
    name: "Uptime"
    id: sensor_uptime
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: sensor_ip
      on_value:
        - lvgl.label.update:
            id: ip_address_info_state
            text: !lambda "return x;"
    ssid:
      name: "Connected SSID"
    mac_address:
      name: "MAC Address"
      id: sensor_mac
      on_value:
        - lvgl.label.update:
            id: mac_address_info_state
            text: !lambda "return x;"


  # Weather state
  - platform: homeassistant
    id: ha_weather_condition
    entity_id: weather.forecast_home
    on_value:
      - script.execute: update_weather_image

# ─── Backlight ────────────────────────────────────────────────────────────────
output:
  - platform: ledc
    id: backlight_output
    pin: GPIO38
    frequency: 150Hz
    min_power: 0.01
    zero_means_zero: true

light:
  - platform: monochromatic
    name: "Backlight"
    id: display_backlight
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 1s

# ─── SPI ──────────────────────────────────────────────────────────────────────
spi:
  - id: lcd_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47

# ─── I2C ──────────────────────────────────────────────────────────────────────
i2c:
  id: touchscreen_bus
  sda: GPIO19
  scl:
    number: GPIO45
    ignore_strapping_warning: true

# ─── Display ──────────────────────────────────────────────────────────────────
display:
  - platform: st7701s
    id: tft_display
    dimensions: { width: 480, height: 480 }
    spi_mode: MODE3
    data_rate: 2MHz
    color_order: RGB
    invert_colors: false
    cs_pin: GPIO39
    de_pin: GPIO18
    hsync_pin: GPIO16
    vsync_pin: GPIO17
    pclk_pin: GPIO21
    pclk_frequency: 12MHz
    pclk_inverted: false
    hsync_pulse_width: 8
    hsync_front_porch: 10
    hsync_back_porch: 20
    vsync_pulse_width: 8
    vsync_front_porch: 10
    vsync_back_porch: 10
    update_interval: never
    auto_clear_enabled: false
    init_sequence:
      - 1
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xCD, 0x00]
    data_pins:
      red:   [11, 12, 13, 14,  0]
      green: [ 8, 20,  3, 46,  9, 10]
      blue:  [ 4,  5,  6,  7, 15]

# ─── Touchscreen ──────────────────────────────────────────────────────────────
touchscreen:
  - platform: gt911
    id: tft_touch
    display: tft_display
    transform:
      swap_xy: false
      mirror_x: false
    on_touch:
      # Wake the display on any touch.
      # lvgl.resume must come first — while LVGL is paused it cannot
      # process touch events, so the resume call happens unconditionally
      # via the touchscreen driver before LVGL sees the event.
      - lvgl.resume:
      - light.turn_on:
          id: display_backlight
          brightness: 100%
          transition_length: 300ms
      - lvgl.widget.redraw:

# ─── Backlight timeout number ─────────────────────────────────────────────────
number:
  - platform: template
    id: display_timeout_backlight
    name: "Backlight timeout"
    optimistic: true
    unit_of_measurement: "m"
    initial_value: 5
    restore_value: true
    min_value: -1
    max_value: 720
    step: 1
    mode: box

# ─── Scripts ──────────────────────────────────────────────────────────────────
script:

  # ── Clock update ────────────────────────────────────────────────────────────
  - id: time_update
    mode: queued
    then:
      - lambda: |-
          auto now = id(sntp_time).now();
          if (!now.is_valid()) return;

          char tbuf[6];
          snprintf(tbuf, sizeof(tbuf), "%02d:%02d", now.hour, now.minute);
          lv_label_set_text(id(time_value), tbuf);

          // Day of week
          const char* days[] = {"Sun","Mon","Tue","Wed","Thu","Fri","Sat"};
          lv_label_set_text(id(day_of_week_value), days[now.day_of_week - 1]);

          // Date
          const char* months[] = {"January","February","March","April","May","June",
                                   "July","August","September","October","November","December"};
          char dbuf[32];
          snprintf(dbuf, sizeof(dbuf), "%02d, %s", now.day_of_month, months[now.month - 1]);
          lv_label_set_text(id(date_month_value), dbuf);

  # ── WiFi icon update ────────────────────────────────────────────────────────
  - id: update_wifi_icon
    then:
      - lambda: |-
          float pct = id(wifi_signal_percent).state;
          const char* icon;
          if      (pct > 75) icon = "\U0000e934";
          else if (pct > 50) icon = "\U0000e933";
          else if (pct > 25) icon = "\U0000e932";
          else               icon = "\U0000e931";
          lv_label_set_text(id(wifi_status), icon);
          lv_obj_set_style_text_color(id(wifi_status), lv_color_hex(0x5CA848), LV_PART_MAIN);

  # ── Weather image show/hide ──────────────────────────────────────────────────
  - id: update_weather_image
    then:
      - lambda: |-
          std::string w = id(ha_weather_condition).state;

          lv_obj_add_flag(id(weather_sunny_image),              LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(weather_clear_night_image),        LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(weather_cloudy_image),             LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(weather_partlycloudy_sun_image),   LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(weather_partlycloudy_moon_image),  LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(weather_rainy_image),              LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(weather_pouring_image),            LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(weather_snowy_image),              LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(weather_snowy_rainy_image),        LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(weather_fog_image),                LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(weather_hail_image),               LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(weather_lightning_image),          LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(weather_lightning_rainy_image),    LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(weather_windy_image),              LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(weather_windy_variant_image),      LV_OBJ_FLAG_HIDDEN);

          // Also update condition text
          std::string cond = w;
          if      (w == "clear-night")     cond = "Clear Night";
          else if (w == "cloudy")          cond = "Cloudy";
          else if (w == "fog")             cond = "Foggy";
          else if (w == "hail")            cond = "Hail";
          else if (w == "lightning")       cond = "Lightning";
          else if (w == "lightning-rainy") cond = "Thunderstorm";
          else if (w == "partlycloudy")    cond = "Partly Cloudy";
          else if (w == "pouring")         cond = "Heavy Rain";
          else if (w == "rainy")           cond = "Rainy";
          else if (w == "snowy")           cond = "Snowy";
          else if (w == "snowy-rainy")     cond = "Sleet";
          else if (w == "sunny")           cond = "Sunny";
          else if (w == "windy")           cond = "Windy";
          else if (w == "windy-variant")   cond = "Windy";
          lv_label_set_text(id(weather_state_label), cond.c_str());

          bool is_night = false;
          if (w == "clear-night") {
            lv_obj_clear_flag(id(weather_clear_night_image), LV_OBJ_FLAG_HIDDEN);
          } else if (w == "cloudy") {
            lv_obj_clear_flag(id(weather_cloudy_image), LV_OBJ_FLAG_HIDDEN);
          } else if (w == "partlycloudy") {
            lv_obj_clear_flag(id(weather_partlycloudy_sun_image), LV_OBJ_FLAG_HIDDEN);
          } else if (w == "rainy") {
            lv_obj_clear_flag(id(weather_rainy_image), LV_OBJ_FLAG_HIDDEN);
          } else if (w == "pouring") {
            lv_obj_clear_flag(id(weather_pouring_image), LV_OBJ_FLAG_HIDDEN);
          } else if (w == "snowy") {
            lv_obj_clear_flag(id(weather_snowy_image), LV_OBJ_FLAG_HIDDEN);
          } else if (w == "snowy-rainy") {
            lv_obj_clear_flag(id(weather_snowy_rainy_image), LV_OBJ_FLAG_HIDDEN);
          } else if (w == "fog") {
            lv_obj_clear_flag(id(weather_fog_image), LV_OBJ_FLAG_HIDDEN);
          } else if (w == "hail") {
            lv_obj_clear_flag(id(weather_hail_image), LV_OBJ_FLAG_HIDDEN);
          } else if (w == "lightning") {
            lv_obj_clear_flag(id(weather_lightning_image), LV_OBJ_FLAG_HIDDEN);
          } else if (w == "lightning-rainy") {
            lv_obj_clear_flag(id(weather_lightning_rainy_image), LV_OBJ_FLAG_HIDDEN);
          } else if (w == "windy") {
            lv_obj_clear_flag(id(weather_windy_image), LV_OBJ_FLAG_HIDDEN);
          } else if (w == "windy-variant") {
            lv_obj_clear_flag(id(weather_windy_variant_image), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_clear_flag(id(weather_sunny_image), LV_OBJ_FLAG_HIDDEN);
          }

  # ── Mode switcher ────────────────────────────────────────────────────────────
  # Hides/shows the main card sub-widgets and middle row controls
  - id: switch_to_mode
    parameters:
      target_mode: int
    then:
      - lambda: |-
          id(current_mode) = target_mode;

          // Main card sub-widgets
          if (target_mode == 0) { // HOME
            lv_obj_clear_flag(id(weather_time_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(datetime_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(weather_state_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(info_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(settings_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(weather_state_images), LV_OBJ_FLAG_HIDDEN);
                // Circle
          } else if (target_mode == 1) { // WEATHER
            lv_obj_clear_flag(id(weather_time_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(datetime_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(weather_state_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(info_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(settings_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(weather_state_images), LV_OBJ_FLAG_HIDDEN);
              } else if (target_mode == 2) { // INFO
            lv_obj_add_flag(id(weather_time_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(datetime_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(weather_state_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(info_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(settings_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(weather_state_images), LV_OBJ_FLAG_HIDDEN);
              } else if (target_mode == 3) { // SETTINGS
            lv_obj_add_flag(id(weather_time_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(datetime_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(weather_state_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(info_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(settings_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(weather_state_images), LV_OBJ_FLAG_HIDDEN);
              }

# ─── Fonts ────────────────────────────────────────────────────────────────────
font:

  # Nunito SemiBold — primary UI font (from repo assets)
  - file: "assets/fonts/Nunito-SemiBold.ttf"
    id: nunito_16
    size: 16
    bpp: 4
    glyphsets: [GF_Latin_Core]

  - file: "assets/fonts/Nunito-SemiBold.ttf"
    id: nunito_18
    size: 18
    bpp: 4
    glyphsets: [GF_Latin_Core]

  - file: "assets/fonts/Nunito-SemiBold.ttf"
    id: nunito_20
    size: 20
    bpp: 4
    glyphsets: [GF_Latin_Core]

  - file: "assets/fonts/Nunito-SemiBold.ttf"
    id: nunito_30
    size: 30
    bpp: 4
    glyphsets: [GF_Latin_Core]

  - file: "assets/fonts/Nunito-SemiBold.ttf"
    id: nunito_48
    size: 48
    bpp: 4
    glyphsets: [GF_Latin_Core]

  - file: "assets/fonts/Nunito-SemiBold.ttf"
    id: nunito_56
    size: 56
    bpp: 4
    glyphsets: [GF_Latin_Core]

  - file: "assets/fonts/Nunito-SemiBold.ttf"
    id: nunito_64
    size: 64
    bpp: 4
    glyphsets: [GF_Latin_Core]

  # Custom icon font (from repo assets)
  - file: "assets/fonts/icons_v2.ttf"
    id: icons_24
    size: 24
    bpp: 4
    glyphs: [
      "\U0000e92e",  # lock
      "\U0000e925",  # thermostat
      "\U0000e93b",  # air conditioner
      "\U0000e936",  # heating
      "\U0000e935",  # home assistant
      "\U0000e931",  # wifi 25%
      "\U0000e932",  # wifi 50%
      "\U0000e933",  # wifi 75%
      "\U0000e934",  # wifi 100%
      "\U0000e938",  # humidity
    ]

  - file: "assets/fonts/icons_v2.ttf"
    id: icons_36
    size: 36
    bpp: 4
    glyphs: [
      "\U0000e903",  # settings
      "\U0000e904",  # info
      "\U0000e905",  # devices
      "\U0000e906",  # home
      "\U0000e907",  # ceiling
      "\U0000e908",  # lightbulb
    ]

  # Material Design Icons
  - file: "assets/fonts/materialdesignicons-webfont.ttf"
    id: mdi_icons_24
    size: 24
    bpp: 4
    glyphs: [
      "\U000F07D0",  # home assistant
      "\U000F068A",  # shield home
    ]

  - file: "assets/fonts/materialdesignicons-webfont.ttf"
    id: mdi_icons_28
    size: 28
    bpp: 4
    glyphs: [
      "\U000F0238",  # heat / fire
      "\U000F0425",  # off / power off
      "\U000F0341",  # display lock
