            id: home_bg_indicators
            y: 10
            width: 460
            height: 40
            align: top_mid
            pad_all: 0
            bg_opa: transp
            border_opa: transp
            shadow_opa: transp
            widgets:

              - label:
                  id: wifi_status
                  align: left_mid
                  x: 20
                  text: "\U0000e934"
                  text_color: 0x606682
                  text_font: icons_24

              - label:
                  id: ha_status
                  align: left_mid
                  x: 60
                  text: "\U000F07D0"
                  text_color: 0x606682
                  text_font: mdi_icons_24



        # ── Main card ─────────────────────────────────────────────────────────
